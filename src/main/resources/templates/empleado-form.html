<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container" style="max-width: 500px;">
    <h1 class="h3 mb-3"
        th:text="${empleado.id == null} ? 'Nuevo empleado' : 'Editar empleado'">Empleado</h1>

    <div th:replace="~{fragments :: alertas}"></div>

    <form th:action="${empleado.id == null} ? @{/empleados/guardar} : @{/empleados/{id}/actualizar(id=${empleado.id})}"
          th:object="${empleado}" method="post">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cédula (9 dígitos)</label>
            <input type="text" class="form-control" th:field="*{cedula}">
            <div class="text-danger small" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="text" class="form-control" th:field="*{email}">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Puesto</label>
            <select class="form-select" th:field="*{puesto}">
                <option value="">-- Seleccione un puesto --</option>
                <option th:each="p : ${puestos}" th:value="${p}" th:text="${p.etiqueta}">Puesto</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('puesto')}" th:errors="*{puesto}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Salario</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{salario}">
            <div class="text-danger small" th:if="${#fields.hasErrors('salario')}" th:errors="*{salario}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de ingreso</label>
            <input type="date" class="form-control" th:field="*{fechaIngreso}">
            <div class="text-danger small" th:if="${#fields.hasErrors('fechaIngreso')}" th:errors="*{fechaIngreso}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Departamento</label>
            <select class="form-select" name="departamentoId">
                <option value="">-- Seleccione un departamento --</option>
                <option th:each="d : ${departamentos}"
                        th:value="${d.id}"
                        th:text="${d.nombre}"
                        th:selected="${departamentoId != null and departamentoId == d.id}">Departamento</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/empleados}">Cancelar</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
