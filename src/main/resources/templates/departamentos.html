<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Departamentos</h1>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')"
           th:href="@{/departamentos/nuevo}">Nuevo departamento</a>
    </div>

    <div th:replace="~{fragments :: alertas}"></div>

    <p th:if="${#lists.isEmpty(departamentos)}">Todavía no hay departamentos.</p>

    <table class="table table-striped align-middle" th:unless="${#lists.isEmpty(departamentos)}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th class="text-end">Presupuesto</th>
                <th class="text-center">Empleados</th>
                <th class="text-end">Planilla</th>
                <th class="text-end">Disponible</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${departamentos}">
                <td th:text="${d.nombre}">Nombre</td>
                <td th:text="${d.ubicacion}">Ubicación</td>
                <td class="text-end"
                    th:text="'₡' + ${#numbers.formatDecimal(d.presupuesto, 1, 'POINT', 2, 'COMMA')}">₡0,00</td>
                <td class="text-center">
                    <a th:href="@{/empleados(departamentoId=${d.id})}" th:text="${d.empleados.size()}">0</a>
                </td>
                <td class="text-end"
                    th:text="'₡' + ${#numbers.formatDecimal(d.planilla, 1, 'POINT', 2, 'COMMA')}">₡0,00</td>
                <td class="text-end"
                    th:text="'₡' + ${#numbers.formatDecimal(d.disponible, 1, 'POINT', 2, 'COMMA')}">₡0,00</td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/departamentos/{id}/editar(id=${d.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/departamentos/{id}/eliminar(id=${d.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este departamento?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
