<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <div th:replace="~{fragments :: alertas}"></div>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.nombre}">Nombre</td>
                <td th:text="${u.username}">usuario</td>
                <td th:text="${u.email}">correo</td>
                <td th:text="${u.rol}">USER</td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este usuario?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
